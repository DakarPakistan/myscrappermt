name: Collect Malta businesses

on:
  workflow_dispatch:
    inputs:
      category_start_id:
        description: "First category ID to scrape (inclusive; 0 means no lower bound)"
        required: false
        default: "0"
        type: number
      category_end_id:
        description: "Last category ID to scrape (inclusive; 0 means no upper bound)"
        required: false
        default: "0"
        type: number
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: malta-business-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python files
        run: python -m compileall -q src
      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          url = os.environ.get("DATABASE_URL", "").strip().strip("\"'")
          if not url:
              sys.exit("::error::DATABASE_URL secret is not set. Add it under Settings > Secrets and variables > Actions.")
          parts = urlsplit(url)
          try:
              port = parts.port
          except ValueError:
              port = None
          print(f"scheme={parts.scheme} host={parts.hostname} port={port}")
          if parts.scheme not in ("postgres", "postgresql") or not parts.hostname or not port:
              sys.exit("::error::DATABASE_URL must look like postgres://user:password@host:PORT/dbname?sslmode=require (paste only the URL, no DATABASE_URL= prefix, with a numeric port).")
          PY
      - name: Collect businesses
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YELLOW_BASE_URL: ${{ vars.YELLOW_BASE_URL || 'https://www.yellow.com.mt' }}
          MAX_CATEGORIES_PER_RUN: ${{ vars.MAX_CATEGORIES_PER_RUN || '0' }}
          CATEGORY_START_ID: ${{ inputs.category_start_id || vars.CATEGORY_START_ID || '0' }}
          CATEGORY_END_ID: ${{ inputs.category_end_id || vars.CATEGORY_END_ID || '0' }}
          MAX_PAGES_PER_CATEGORY: ${{ vars.MAX_PAGES_PER_CATEGORY || '100' }}
          HTTP_TIMEOUT_SECONDS: ${{ vars.HTTP_TIMEOUT_SECONDS || '60' }}
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS || '2' }}
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: DEBUG
        run: python -m src.main
